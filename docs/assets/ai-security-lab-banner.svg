<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">Zodiac Bank AI Security Lab</title>
  <desc id="desc">Professional dark animated security operations banner for the synthetic Zodiac Bank AI security training lab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.48" stop-color="#071525"/>
      <stop offset="1" stop-color="#10112a"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-opacity=".1"/>
    </pattern>
    <pattern id="microgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#94a3b8" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .eyebrow { font: 600 12px 'JetBrains Mono','SFMono-Regular',monospace; letter-spacing: 2.8px; }
      .title { font: 800 55px 'Inter','Segoe UI',sans-serif; letter-spacing: 6px; }
      .subtitle { font: 600 16px 'Inter','Segoe UI',sans-serif; letter-spacing: 3.5px; }
      .label { font: 600 10px 'JetBrains Mono','SFMono-Regular',monospace; letter-spacing: 1.4px; }
      .metric { font: 700 15px 'JetBrains Mono','SFMono-Regular',monospace; letter-spacing: 1px; }
      .chip { font: 700 11px 'Inter','Segoe UI',sans-serif; letter-spacing: 1.1px; }
      .scan { animation: scan 5s linear infinite; }
      .scan2 { animation: scan 7s linear 2.1s infinite; opacity: .35; }
      .breathe { animation: breathe 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .breathe2 { animation: breathe 3.6s ease-in-out 1.2s infinite; transform-box: fill-box; transform-origin: center; }
      .flow { stroke-dasharray: 4 14; animation: flow 2.8s linear infinite; }
      .flow2 { stroke-dasharray: 2 11; animation: flow 4s linear 1s infinite; }
      .bar { animation: bar 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
      .blink { animation: blink 2.4s steps(2,end) infinite; }
      @keyframes scan { from { transform: translateX(-180px); } to { transform: translateX(1580px); } }
      @keyframes breathe { 0%,100% { opacity: .35; transform: scale(.78); } 50% { opacity: 1; transform: scale(1.3); } }
      @keyframes flow { to { stroke-dashoffset: -72; } }
      @keyframes bar { 0%,100% { transform: scaleX(.72); } 50% { transform: scaleX(1); } }
      @keyframes blink { 0%,45% { opacity: .45; } 46%,100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .scan,.scan2,.breathe,.breathe2,.flow,.flow2,.bar,.blink { animation: none; } }
    </style>
  </defs>

  <!-- Dark operations-console foundation -->
  <rect width="1400" height="380" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1397" height="377" rx="21" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="18" y="18" width="1364" height="344" rx="14" fill="url(#grid)"/>
  <rect x="18" y="18" width="1364" height="344" rx="14" fill="url(#microgrid)" opacity=".35"/>
  <path d="M18 72H1382M18 316H1382" stroke="#334155" stroke-opacity=".55"/>
  <path d="M620 72V316" stroke="#334155" stroke-opacity=".45"/>

  <!-- Restrained ambient light, deliberately darker than the previous banner -->
  <ellipse cx="1040" cy="186" rx="290" ry="170" fill="#1d4ed8" opacity=".1" filter="url(#softGlow)"/>
  <ellipse cx="260" cy="190" rx="210" ry="150" fill="#0891b2" opacity=".08" filter="url(#softGlow)"/>

  <!-- Header/status rail -->
  <g transform="translate(48 42)">
    <circle cx="5" cy="0" r="4" fill="#22d3ee" class="breathe" filter="url(#glow)"/>
    <text x="18" y="4" class="eyebrow" fill="#94a3b8">ZODIAC BANK / AI SECURITY OPERATIONS</text>
    <text x="1165" y="4" text-anchor="end" class="eyebrow" fill="#64748b">LOCAL // SYNTHETIC // CONTROLLED</text>
  </g>

  <!-- Spartan identity panel -->
  <g transform="translate(58 100)">
    <rect width="160" height="174" rx="12" fill="#020617" fill-opacity=".68" stroke="#1e40af" stroke-opacity=".65"/>
    <rect x="10" y="10" width="140" height="154" rx="8" fill="none" stroke="#475569" stroke-opacity=".35" stroke-dasharray="2 8"/>
    <image href="spartan-emblem.svg" x="27" y="22" width="106" height="106"/>
    <path d="M25 143H135" stroke="#334155"/>
    <text x="80" y="157" text-anchor="middle" class="label" fill="#67e8f9">DEFENSE POSTURE</text>
  </g>

  <!-- Main title block -->
  <g transform="translate(260 112)">
    <text class="eyebrow" fill="#22d3ee">[ HARD-GATED TRAINING RANGE / 2026 ]</text>
    <text y="68" class="title" fill="url(#headline)">ZODIAC BANK</text>
    <text y="104" class="subtitle" fill="#cbd5e1">AI SECURITY LAB  /  GRAPH  /  RAG  /  APT</text>
    <text y="139" class="eyebrow" fill="#64748b">RECON  →  DETECT  →  CONTAIN  →  ADVANCE</text>

    <g transform="translate(0 164)">
      <rect width="128" height="30" rx="6" fill="#082f49" stroke="#0891b2" stroke-opacity=".85"/>
      <circle cx="16" cy="15" r="4" fill="#22d3ee" class="blink"/>
      <text x="29" y="20" class="chip" fill="#a5f3fc">51 SCENARIOS</text>
      <rect x="140" width="128" height="30" rx="6" fill="#172554" stroke="#4f46e5" stroke-opacity=".8"/>
      <circle cx="156" cy="15" r="4" fill="#818cf8" class="blink"/>
      <text x="169" y="20" class="chip" fill="#c7d2fe">10 HARD GATES</text>
      <rect x="280" width="126" height="30" rx="6" fill="#111827" stroke="#64748b" stroke-opacity=".8"/>
      <circle cx="296" cy="15" r="4" fill="#94a3b8" class="blink"/>
      <text x="309" y="20" class="chip" fill="#cbd5e1">NO EGRESS</text>
    </g>
  </g>

  <!-- Dynamic security telemetry panel -->
  <g transform="translate(700 98)">
    <rect width="624" height="190" rx="12" fill="#020617" fill-opacity=".82" stroke="#334155" stroke-opacity=".9"/>
    <path d="M0 42H624" stroke="#334155"/>
    <text x="24" y="27" class="eyebrow" fill="#cbd5e1">LIVE TRAINING TELEMETRY</text>
    <text x="600" y="27" text-anchor="end" class="label" fill="#22d3ee">PROFILE: APT-READY</text>

    <!-- Flow graph -->
    <g transform="translate(26 68)">
      <path d="M24 38 C80 2 106 2 160 38 S242 74 296 38 S378 2 432 38 S514 74 568 38" fill="none" stroke="#0e7490" stroke-width="2" opacity=".5"/>
      <path d="M24 38 C80 2 106 2 160 38 S242 74 296 38 S378 2 432 38 S514 74 568 38" fill="none" stroke="url(#rail)" stroke-width="2" class="flow"/>
      <circle cx="24" cy="38" r="7" fill="#020617" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="160" cy="38" r="7" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="296" cy="38" r="7" fill="#020617" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="432" cy="38" r="7" fill="#020617" stroke="#818cf8" stroke-width="2"/>
      <circle cx="568" cy="38" r="7" fill="#020617" stroke="#a5b4fc" stroke-width="2"/>
      <text x="24" y="72" text-anchor="middle" class="label" fill="#94a3b8">INTENT</text>
      <text x="160" y="72" text-anchor="middle" class="label" fill="#94a3b8">GRAPH</text>
      <text x="296" y="72" text-anchor="middle" class="label" fill="#94a3b8">RAG</text>
      <text x="432" y="72" text-anchor="middle" class="label" fill="#94a3b8">APPROVAL</text>
      <text x="568" y="72" text-anchor="middle" class="label" fill="#94a3b8">AUDIT</text>
    </g>

    <!-- Metrics -->
    <g transform="translate(28 153)">
      <text class="label" fill="#64748b">CONTROL COVERAGE</text>
      <rect x="128" y="-8" width="190" height="7" rx="3.5" fill="#1e293b"/>
      <rect x="128" y="-8" width="190" height="7" rx="3.5" fill="url(#meter)" class="bar"/>
      <text x="336" y="1" class="metric" fill="#bae6fd">100%</text>
      <text x="414" y="1" class="label" fill="#64748b">EXTERNAL EGRESS</text>
      <text x="574" y="1" text-anchor="end" class="metric" fill="#86efac">DENIED</text>
    </g>
  </g>

  <!-- Bottom signal line and animated scan -->
  <g transform="translate(252 330)">
    <path d="M0 0H1050" stroke="#334155"/>
    <path d="M0 0H1050" stroke="#38bdf8" stroke-opacity=".35" class="flow2"/>
    <text y="22" class="label" fill="#64748b">SYNTHETIC DATA  ·  VIRTUAL LEDGER  ·  BOUNDED EMPLOYEE LOOPS  ·  HUMAN-STYLE CHECKPOINTS</text>
    <text x="1050" y="22" text-anchor="end" class="label" fill="#22d3ee">STATUS: READY</text>
  </g>
  <rect class="scan" x="0" y="76" width="2" height="240" fill="#67e8f9" opacity=".75" filter="url(#glow)"/>
  <rect class="scan2" x="0" y="76" width="1" height="240" fill="#818cf8" filter="url(#glow)"/>
</svg>

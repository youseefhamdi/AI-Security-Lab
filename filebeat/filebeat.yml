filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*.log'
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true

  - type: log
    paths:
      - '/logs/*.log'
    fields:
      type: ai-logs
    fields_under_root: true

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "ai-logs-%{+yyyy.MM.dd}"

setup.kibana:
  host: "kibana:5601"

setup.template:
  name: "ai-logs"
  pattern: "ai-logs-*"

logging.level: info

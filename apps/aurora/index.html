<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurora · Zodiac Bank Support</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%236366f1' stroke-width='1.8' stroke-linejoin='round' d='M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     Zodiac Bank · Aurora — AI Support
     Senior, restrained dark theme (matches the trainer):
     neutrals + a single indigo accent. Clean, professional.
     ============================================================ */
  :root {
    --bg: #0a0a0c;
    --bg-soft: #0e0e11;
    --surface: #131316;
    --surface-2: #18181c;
    --surface-3: #1f1f24;
    --border: #232329;
    --border-soft: #1b1b20;
    --text: #f4f4f5;
    --text-2: #a1a1aa;
    --text-3: #6b6b74;
    --accent: #6366f1;
    --accent-2: #818cf8;
    --accent-soft: rgba(99, 102, 241, .12);
    --success: #22c55e;
    --danger: #ef4444;
    --warn: #f59e0b;
    --muted: #a1a1aa;              /* used by inline JS styles */
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 var(--sans);
    height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  ::selection { background: rgba(99,102,241,.32); color: #fff; }
  a { color: inherit; text-decoration: none; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2a2a31; border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a44; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: relative; z-index: 30;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 22px;
    background: rgba(10,10,12,.88); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  .icon-btn {
    width: 38px; height: 38px; flex: 0 0 38px; padding: 0; justify-content: center;
    border-radius: 9px; background: transparent; border: 1px solid transparent; color: var(--text-3);
  }
  .icon-btn:hover { color: var(--text); background: var(--surface-2); border-color: var(--border); }
  .icon-btn svg { width: 19px; height: 19px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark {
    width: 40px; height: 40px; flex: 0 0 40px; display: grid; place-items: center;
    border-radius: 10px; background: var(--accent-soft); border: 1px solid rgba(99,102,241,.28);
  }
  .brand .mark svg { width: 22px; height: 22px; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .3px; }
  .brand h1 .aur { color: var(--accent-2); }
  .brand .sub { display: block; margin-top: 2px; color: var(--text-3); font: 500 10.5px var(--mono); letter-spacing: 1.5px; text-transform: uppercase; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font: 500 11px var(--mono); letter-spacing: .5px;
    padding: 5px 11px; border: 1px solid var(--border); border-radius: 999px;
    color: var(--text-2); background: var(--surface); white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.ok { color: var(--success); border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.08); }
  .badge.accent { color: var(--accent-2); border-color: rgba(99,102,241,.35); background: var(--accent-soft); }
  .badge.warn { color: var(--warn); border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.08); }
  .badge .dot.blink { animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  /* ---------- App shell ---------- */
  .app { flex: 1 1 auto; display: flex; min-height: 0; }

  .sidebar {
    flex: 0 0 300px; width: 300px; min-width: 0;
    border-right: 1px solid var(--border-soft);
    background: var(--bg-soft);
    display: flex; flex-direction: column; overflow: hidden;
    transition: flex-basis .22s ease, width .22s ease, opacity .18s ease;
  }
  body:not(.sb-open) .sidebar { flex-basis: 0; width: 0; opacity: 0; border-right-color: transparent; }
  .sidebar-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 15px; border-bottom: 1px solid var(--border-soft);
  }
  .sidebar-head h2 { margin: 0; margin-right: auto; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-3); }
  .sidebar-head .icon-btn { width: 30px; height: 30px; flex-basis: 30px; }
  .sidebar-list { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px; }
  .history-empty { color: var(--text-3); font-size: 13px; text-align: center; padding: 26px 8px; }
  .session-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 11px; margin-bottom: 4px; border-radius: 9px;
    border: 1px solid transparent; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .session-item:hover { background: var(--surface); }
  .session-item.active { border-color: var(--border); background: var(--surface); }
  .si-main { flex: 1 1 auto; min-width: 0; }
  .si-title { font-weight: 600; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .si-meta { font: 500 10.5px var(--mono); color: var(--text-3); margin-top: 2px; }
  .si-del { flex: 0 0 auto; border: 0; background: transparent; color: var(--text-3); padding: 1px 6px; font-size: 15px; line-height: 1; border-radius: 5px; opacity: 0; cursor: pointer; }
  .session-item:hover .si-del { opacity: 1; }
  .si-del:hover { color: var(--danger); background: rgba(239,68,68,.12); }

  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .backdrop { display: none; }

  /* ---------- Session bar ---------- */
  .sessionbar {
    display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
    padding: 11px 22px; border-bottom: 1px solid var(--border-soft);
    background: var(--bg-soft);
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--text-3); }
  input, textarea, button { font: inherit; color: var(--text); }
  input, textarea {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 9px; padding: 9px 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input::placeholder, textarea::placeholder { color: var(--text-3); }
  button {
    cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 9px; padding: 9px 13px; font-weight: 600; font-size: 13.5px;
    transition: background .15s, border-color .15s, transform .05s, color .15s;
  }
  button:hover:not(:disabled) { background: var(--surface-3); border-color: #2e2e36; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
  button.ghost { background: transparent; border-color: transparent; color: var(--text-3); }
  button.ghost:hover:not(:disabled) { background: transparent; color: var(--text); border-color: transparent; }
  .session-chip {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 11.5px var(--mono); color: var(--text-2);
    border: 1px dashed var(--border); border-radius: 9px; padding: 8px 11px; white-space: nowrap;
  }
  .session-chip code { color: var(--accent-2); }

  /* ---------- Chat ---------- */
  .chat-wrap {
    flex: 1 1 auto; min-height: 0;
    width: 100%; max-width: 860px; margin: 0 auto;
    padding: 20px 22px 8px; display: flex; flex-direction: column;
  }
  #messages {
    flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto; padding-bottom: 8px; scroll-behavior: smooth;
  }
  .msg { display: flex; gap: 11px; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    flex: 0 0 auto; width: 32px; height: 32px;
    display: grid; place-items: center; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  .msg.assistant .avatar { border-color: rgba(99,102,241,.35); background: var(--accent-soft); }
  .msg.user .avatar { border-color: var(--border); }
  .avatar svg { width: 17px; height: 17px; }
  .bubble {
    max-width: min(78%, 660px);
    padding: 13px 15px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 14.5px; line-height: 1.62; overflow-wrap: anywhere;
  }
  .msg.assistant .bubble { border-top-left-radius: 4px; }
  .msg.user .bubble { border-top-right-radius: 4px; background: var(--surface-2); }
  .bubble .body code {
    font: 12.5px var(--mono); background: var(--surface-3); color: var(--accent-2);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
  }
  .bubble .body .codeblock { position: relative; margin: 9px 0; }
  .bubble .body pre {
    margin: 0; padding: 12px 14px; padding-right: 64px; overflow-x: auto;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px;
    font: 12.5px/1.55 var(--mono); color: var(--text-2);
  }
  .bubble .body pre code { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
  .bubble .body strong { color: var(--text); }
  .code-copy {
    position: absolute; top: 7px; right: 7px;
    padding: 3px 9px; font-size: 10.5px; border-radius: 6px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-3);
  }
  .code-copy:hover { color: var(--text); border-color: var(--accent); }

  /* sources */
  .sources { margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--border-soft); }
  .sources .label { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-3); margin-bottom: 7px; }
  .src {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font: 500 11.5px var(--mono); color: var(--text-2);
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 10px; margin: 3px 0;
  }
  .src .t { color: var(--text); }
  .src .cid { color: var(--accent-2); }
  .src .be { margin-left: auto; color: var(--text-3); font-size: 10.5px; }

  .msg-meta {
    display: flex; align-items: center; gap: 12px; margin-top: 9px; flex-wrap: wrap;
    font: 500 10.5px var(--mono); color: var(--text-3);
  }
  .msg-meta button { padding: 3px 8px; font-size: 10.5px; border-radius: 6px; }

  /* streaming cursor */
  .cursor { display: inline-block; width: 9px; margin-left: 2px; color: var(--accent-2); animation: caret .9s steps(2, start) infinite; }
  @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  /* empty state */
  .welcome { text-align: center; margin: auto 0; padding: 40px 8px; }
  .welcome .mark {
    width: 60px; height: 60px; margin: 0 auto 18px;
    display: grid; place-items: center; border-radius: 16px;
    background: var(--accent-soft); border: 1px solid rgba(99,102,241,.3);
  }
  .welcome .mark svg { width: 32px; height: 32px; }
  .welcome h2 { margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .welcome p { margin: 0 auto 18px; max-width: 480px; color: var(--text-2); font-size: 14px; }
  .prompts { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .prompt {
    border: 1px solid var(--border); border-radius: 999px; padding: 8px 15px;
    background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 500;
  }
  .prompt:hover { border-color: var(--accent); color: var(--text); }

  /* ---------- Composer ---------- */
  .composer { flex: 0 0 auto; width: 100%; max-width: 860px; margin: 0 auto; padding: 10px 22px 16px; }
  .composer form {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 13px; padding: 10px 10px 10px 14px;
    box-shadow: var(--shadow);
  }
  .composer form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer textarea {
    flex: 1 1 auto; min-height: 44px; max-height: 160px; resize: none;
    background: transparent; border: 0; padding: 8px 4px; font-size: 14.5px; line-height: 1.5;
  }
  .composer textarea:focus { outline: none; box-shadow: none; border-color: transparent; }
  .composer .send { flex: 0 0 auto; min-height: 44px; padding: 0 20px; }
  .composer .hint { margin: 7px 2px 0; font: 500 10.5px var(--mono); color: var(--text-3); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; right: 20px; bottom: 20px; z-index: 80; max-width: 420px;
    padding: 13px 16px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2);
    box-shadow: var(--shadow); display: none;
    font: 600 13px var(--sans); color: var(--text); white-space: pre-wrap;
  }
  #toast.error { border-color: rgba(239,68,68,.45); color: #fca5a5; }
  #toast.ok { border-color: rgba(34,197,94,.4); color: var(--success); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1023px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 45;
      width: 300px; flex-basis: auto;
      transform: translateX(-102%); transition: transform .22s ease;
      border-right: 1px solid var(--border-soft);
    }
    body:not(.sb-open) .sidebar { transform: translateX(-102%); width: 300px; opacity: 1; flex-basis: auto; border-right-color: var(--border-soft); }
    body.sb-open .sidebar { transform: translateX(0); box-shadow: 16px 0 40px rgba(0,0,0,.45); }
    .backdrop { display: block; position: fixed; inset: 0; z-index: 44; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    body.sb-open .backdrop { opacity: 1; pointer-events: auto; }
  }
  @media (max-width: 560px) {
    .bubble { max-width: 88%; }
    .topbar, .sessionbar { padding-left: 14px; padding-right: 14px; }
    .chat-wrap { padding-left: 14px; padding-right: 14px; }
    .composer { padding-left: 14px; padding-right: 14px; }
    .badges { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    #messages { scroll-behavior: auto; }
  }
</style>
</head>

<script>
// @ts-check
"use strict";

/**
 * @typedef {HTMLElement & { value?: string, dataset?: DOMStringMap }} TrainerElement
 */

/** @param {string} id @returns {TrainerElement} */
const $ = (id) => /** @type {TrainerElement} */ (document.getElementById(id));
/** @param {string} selector @returns {NodeListOf<HTMLElement>} */
const $$ = (selector) => /** @type {NodeListOf<HTMLElement>} */ (document.querySelectorAll(selector));
const messagesEl = $("messages");
const form = $("chat-form");
const queryEl = $("query");

let sessionId = (crypto.randomUUID ? crypto.randomUUID() : "zb-" + Date.now());
let customerId = "";
let busy = false;
let sbOpen = window.innerWidth >= 1024;

const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

function truncate(s, n) { const t = String(s).replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; }
function relTime(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60); if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60); if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}

/* Markdown-lite: fenced code, inline code, bold, italics, line breaks. */
function md(raw) {
  const chunks = String(raw).split("```");
  let html = "";
  chunks.forEach((chunk, i) => {
    if (i % 2 === 1) {
      const code = chunk.replace(/^\s*\n/, "").replace(/\n\s*$/, "");
      html += `<div class="codeblock"><pre><code>${esc(code)}</code></pre></div>`;
    } else {
      let t = esc(chunk);
      t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
      t = t.replace(/\n/g, "<br>");
      html += t;
    }
  });
  return html;
}

function decorateCodeBlocks(root) {
  $$(".codeblock").forEach((block) => {
    if (block.dataset.decorated) return;
    block.dataset.decorated = "1";
    const code = block.querySelector("code");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "code-copy";
    btn.textContent = "Copy";
    btn.addEventListener("click", () => {
      navigator.clipboard.writeText(code ? code.textContent : "").then(() => {
        btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1200);
      });
    });
    block.prepend(btn);
  });
}

const AVATAR_AURORA = `<svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/></svg>`;
const AVATAR_USER = `<svg viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5l8-3z"/><path d="M8.5 15.5l2.2-4.6 2.2 2.3 2.6-5.2"/></svg>`;

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function addMsg(role, html) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML = `<div class="avatar" aria-hidden="true">${role === "user" ? AVATAR_USER : AVATAR_AURORA}</div><div class="bubble">${html}</div>`;
  messagesEl.appendChild(wrap);
  scrollBottom();
  return wrap.querySelector(".bubble");
}

function renderSources(sources) {
  if (!sources || !sources.length) return "";
  const items = sources.map((s) => `
    <div class="src">
      <span class="t">${esc(s.title || "source")}</span>
      <span class="cid">${esc(s.chunk_id || "")}</span>
      <span class="be">${esc(s.backend || "")}</span>
    </div>`).join("");
  return `<div class="sources"><div class="label">Retrieved sources</div>${items}</div>`;
}

function addAssistantStream() {
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.innerHTML = `<div class="avatar" aria-hidden="true">${AVATAR_AURORA}</div>
    <div class="bubble">
      <div class="body"><span class="cursor" aria-hidden="true">▍</span></div>
      <div class="sources-wrap"></div>
      <div class="msg-meta"></div>
    </div>`;
  messagesEl.appendChild(wrap);
  scrollBottom();
  return {
    body: wrap.querySelector(".body"),
    sources: wrap.querySelector(".sources-wrap"),
    meta: wrap.querySelector(".msg-meta"),
  };
}

/* ---------- History (client-side, localStorage) ---------- */
const STORE_KEY = "zb-aurora-sessions";
let sessions = [];
let currentMessages = [];
let currentTitle = "";

function loadSessions() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch (_) { return []; } }
function persistSessions() { try { localStorage.setItem(STORE_KEY, JSON.stringify(sessions)); } catch (_) {} }

function renderHistory() {
  const list = $("history-list");
  if (!sessions.length) { list.innerHTML = '<div class="history-empty">No conversations yet.</div>'; return; }
  const sorted = sessions.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  list.innerHTML = sorted.map((s) => `
    <div class="session-item ${s.id === sessionId ? "active" : ""}" data-id="${esc(s.id)}" role="button" tabindex="0">
      <div class="si-main">
        <div class="si-title">${esc(s.title || "New conversation")}</div>
        <div class="si-meta">${(s.messages || []).length} messages · ${relTime(s.updatedAt || Date.now())}</div>
      </div>
      <button class="si-del" type="button" data-del="${esc(s.id)}" title="Delete conversation">×</button>
    </div>`).join("");
  $$(".session-item").forEach((item) => {
    const open = () => openSession(item.dataset.id);
    item.addEventListener("click", (e) => { if (/** @type {Element} */ (e.target).closest(".si-del")) return; open(); });
    item.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  $$(".si-del").forEach((btn) => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); deleteSession(btn.dataset.del); });
  });
}

function saveCurrentSession() {
  if (!currentMessages.length) return;
  const title = currentTitle || (currentMessages[0] ? truncate(currentMessages[0].content, 40) : "Conversation");
  const entry = { id: sessionId, title, updatedAt: Date.now(), messages: currentMessages.slice() };
  const existing = sessions.find((s) => s.id === sessionId);
  if (existing) Object.assign(existing, entry); else sessions.push(entry);
  persistSessions();
}

function newSession() {
  saveCurrentSession();
  sessionId = crypto.randomUUID ? crypto.randomUUID() : "zb-" + Date.now();
  currentMessages = []; currentTitle = "";
  $("session-id").textContent = sessionId.slice(0, 13);
  showWelcome();
  renderHistory();
}

function openSession(id) {
  if (id === sessionId && messagesEl.querySelector(".msg")) return;
  saveCurrentSession();
  const s = sessions.find((x) => x.id === id);
  if (!s) return;
  sessionId = s.id;
  currentMessages = (s.messages || []).slice();
  currentTitle = s.title || "";
  $("session-id").textContent = sessionId.slice(0, 13);
  renderMessages();
  renderHistory();
  setSidebar(window.innerWidth < 1024 ? false : sbOpen);
}

function deleteSession(id) {
  sessions = sessions.filter((s) => s.id !== id);
  persistSessions();
  if (id === sessionId) newSession(); else renderHistory();
}

function renderMessages() {
  messagesEl.innerHTML = "";
  if (!currentMessages.length) { showWelcome(); return; }
  currentMessages.forEach((m) => {
    if (m.role === "user") addMsg("user", `<div class="body">${esc(m.content).replace(/\n/g, "<br>")}</div>`);
    else addMsg("assistant", `<div class="body">${md(m.content)}</div>`);
  });
  messagesEl.querySelectorAll(".msg.assistant .body").forEach((b) => decorateCodeBlocks(b));
  scrollBottom();
}

function setSidebar(open) {
  sbOpen = open;
  document.body.classList.toggle("sb-open", open);
}

/* ---------- Welcome ---------- */
function showWelcome() {
  messagesEl.innerHTML = `
    <div class="welcome">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/></svg>
      </div>
      <h2>Aurora Support</h2>
      <p>Your synthetic Zodiac Bank assistant. Ask about policies, accounts, or support — answers are grounded in the local knowledge corpus.</p>
      <div class="prompts">
        <button class="prompt" type="button" data-q="What are your business banking hours?">Business banking hours</button>
        <button class="prompt" type="button" data-q="How do I dispute a transaction?">Dispute a transaction</button>
        <button class="prompt" type="button" data-q="What is the overdraft policy?">Overdraft policy</button>
        <button class="prompt" type="button" data-q="How do I reset my online banking password?">Reset my password</button>
      </div>
    </div>`;
  $$(".prompt").forEach((b) => {
    b.addEventListener("click", () => { queryEl.value = b.dataset.q; submit(b.dataset.q); });
  });
}

/* ---------- Submit (streaming) ---------- */
async function submit(query) {
  const q = (query || queryEl.value).trim();
  if (!q || busy) return;
  busy = true;
  queryEl.value = "";

  if (messagesEl.querySelector(".welcome")) messagesEl.innerHTML = "";
  addMsg("user", `<div class="body">${esc(q).replace(/\n/g, "<br>")}</div>`);
  currentMessages.push({ role: "user", content: q });
  if (!currentTitle) currentTitle = truncate(q, 40);
  saveCurrentSession();
  renderHistory();

  const view = addAssistantStream();
  let acc = "";
  let meta = null;
  let errored = false;

  const finish = () => {
    view.body.innerHTML = md(acc) || '<em style="color:var(--muted)">No answer received.</em>';
    decorateCodeBlocks(view.body);
    view.sources.innerHTML = renderSources(meta ? meta.sources : []);
    view.meta.innerHTML =
      `<span>${esc((meta && meta.model) || "model")}</span>` +
      `<span>retrieval: ${esc((meta && meta.retrieval_backend) || "—")}</span>` +
      `<span>context: ${esc((meta && meta.context_engineering && meta.context_engineering.mode) || "—")}</span>` +
      `<button class="ghost" type="button" data-copy="${esc(acc)}">Copy</button>`;
    const copy = /** @type {HTMLElement|null} */ (view.meta.querySelector("[data-copy]"));
    if (copy) copy.addEventListener("click", (e) => {
      const target = /** @type {TrainerElement} */ (e.target);
      navigator.clipboard.writeText(target.dataset.copy).then(() => { target.textContent = "Copied"; setTimeout(() => (target.textContent = "Copy"), 1200); });
    });
    if (acc) { currentMessages.push({ role: "assistant", content: acc }); saveCurrentSession(); renderHistory(); }
    scrollBottom();
  };
  const fail = (html) => { view.body.innerHTML = html; scrollBottom(); };

  try {
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q, session_id: sessionId, user_id: customerId || "anonymous" }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      fail(`<strong style="color:var(--danger)">Backend unavailable</strong><br>${esc(data.detail || data.error || res.statusText)}`);
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        for (const line of frame.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          let ev;
          try { ev = JSON.parse(payload); } catch (_) { continue; }
          if (ev.event === "meta") {
            meta = ev;
          } else if (ev.delta) {
            acc += ev.delta;
            view.body.innerHTML = esc(acc).replace(/\n/g, "<br>") + '<span class="cursor" aria-hidden="true">▍</span>';
            scrollBottom();
          } else if (ev.event === "done") {
            acc = ev.response || acc;
          } else if (ev.error) {
            errored = true;
            acc = "";
            fail(`<strong style="color:var(--danger)">${esc(ev.error)}</strong>${ev.detail ? "<br>" + esc(ev.detail) : ""}`);
          }
        }
      }
    }
    if (!errored) finish();
  } catch (err) {
    fail(`<strong style="color:var(--danger)">Request failed</strong><br>${esc(err.message)}`);
  } finally {
    busy = false;
    queryEl.focus();
  }
}

/* ---------- health / badges ---------- */
fetch("/health")
  .then((r) => r.json())
  .then((h) => {
    $("model-badge").innerHTML = `<span class="dot blink"></span>MODEL: ${esc(h.model || "—").toUpperCase()}`;
    const backends = [];
    if (h.vector_rag && h.vector_rag.enabled) backends.push("chromadb");
    if (h.context_engineering && h.context_engineering.enabled) backends.push("graph");
    backends.push("keyword");
    $("backend-badge").innerHTML = `<span class="dot"></span>RETRIEVAL: ${backends.join(" + ")}`;
  })
  .catch(() => {
    $("model-badge").innerHTML = `<span class="dot"></span>MODEL: OFFLINE`;
  });

/* ---------- wiring ---------- */
sessions = loadSessions();
$("session-id").textContent = sessionId.slice(0, 13);
$("copy-session").addEventListener("click", () => {
  navigator.clipboard.writeText(sessionId).then(() => { $("copy-session").textContent = "Copied"; setTimeout(() => ($("copy-session").textContent = "Copy"), 1200); });
});
$("new-session").addEventListener("click", newSession);
$("sidebar-toggle").addEventListener("click", () => setSidebar(!sbOpen));
$("sidebar-close").addEventListener("click", () => setSidebar(false));
$("backdrop").addEventListener("click", () => setSidebar(false));
$("customer-id").addEventListener("input", (e) => { customerId = /** @type {TrainerElement} */ (e.target).value.trim(); });

form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
queryEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
queryEl.addEventListener("input", () => {
  queryEl.style.height = "auto";
  queryEl.style.height = Math.min(queryEl.scrollHeight, 160) + "px";
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setSidebar(false); });
window.addEventListener("resize", () => { if (window.innerWidth < 1024 && sbOpen) setSidebar(false); });

setSidebar(window.innerWidth >= 1024);
showWelcome();
renderHistory();
</script>
</body>
</html>

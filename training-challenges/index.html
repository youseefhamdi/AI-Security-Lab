<script>
"use strict";
const $=id=>document.getElementById(id), $$=sel=>[...document.querySelectorAll(sel)];
const host=location.hostname||"127.0.0.1", protocol=location.protocol==="https:"?"https:":"http:", defaultGate=`${protocol}//${host}:5050`;
const state={learner:"",token:"",gateUrl:defaultGate,range:null,curriculum:null,currentStage:null,scenarios:[],gates:[],selected:null,hint:null,page:"dashboard",filters:{stage:"all",lane:"all",difficulty:"all",status:"all",q:""}};

const slug=v=>String(v||"").replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const api=async(path,opt={})=>{let r;try{r=await fetch(path,{...opt,headers:{"X-Training-Learner-Token":state.token,...(opt.headers||{})}})}catch(_){throw Error("Trainer service is unreachable. Start the local stack and retry.")}let b=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof(b.detail||b.message)==="string"?(b.detail||b.message):r.statusText);return b};
const gateApi=async(path,opt={})=>{let r;try{r=await fetch(state.gateUrl.replace(/\/$/,"")+path,{...opt,headers:{"X-Training-Learner-Token":state.token,...(opt.headers||{})}})}catch(_){throw Error("Training gate is unreachable. Check the gate URL.")}let b=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof(b.detail||b.message)==="string"?(b.detail||b.message):r.statusText);return b};
function toast(message,kind=""){const el=document.createElement("div");el.className=`toast ${kind}`;el.textContent=message;$("toast-root").append(el);setTimeout(()=>el.remove(),5200)}
function save(){try{localStorage.setItem("zb-range",JSON.stringify({learner:state.learner,token:state.token,gateUrl:state.gateUrl}))}catch(_){} }
function load(){try{const x=JSON.parse(localStorage.getItem("zb-range")||"{}");state.learner=x.learner||"";state.token=x.token||"";state.gateUrl=x.gateUrl&&!(x.gateUrl.includes("127.0.0.1")&&host!=="127.0.0.1"&&host!=="localhost")?x.gateUrl:defaultGate}catch(_){}$("learner-id").value=state.learner;$("learner-token").value=state.token;$("gate-url").value=state.gateUrl}
async function probe(){const d=$("login-dot"),t=$("login-status");d.className="status-dot warn";t.textContent="Checking challenge and gate services…";const p=async u=>fetch(u,{cache:"no-store"}).then(r=>r.ok).catch(()=>false);const [a,b]=await Promise.all([p(`${protocol}//${host}:8060/health`),p(`${state.gateUrl.replace(/\/$/,"")}/health`)]);d.className=`status-dot ${a&&b?"ready":a?"warn":"down"}`;t.textContent=a&&b?"Local stack ready":a?"Trainer ready · gate unavailable":"Trainer unavailable · start the local stack"}
function setPage(name){state.page=name;["dashboard","catalog","detail"].forEach(p=>$(`${p}-page`).classList.toggle("hidden",p!==name));$$(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===name));if(name==="dashboard")renderDashboard();if(name==="catalog")renderCatalog();if(name==="detail")renderDetail()}
function all(){return state.range?state.range.stages.flatMap(s=>(s.scenarios||[]).map(x=>({...x,stage_id:s.stage_id}))):[]}
function stageStatus(id){const m=(state.curriculum?.stages||[]).find(x=>x.id===id);return m?.status==="completed"?"complete":id===state.currentStage?"active":id<(state.currentStage||"L99")?"available":"locked"}
function status(sc){if(sc.stage_id!==state.currentStage)return"locked";return state.scenarios.find(x=>x.scenario_id===sc.scenario_id)?.status||"not-started"}
function band(n){return n<=3?"easy":n<=7?"medium":"hard"}
function points(sc){return(sc.difficulty||1)*100}
function track(sc){return sc.technical_track_label||slug(sc.technical_track||"security boundary")}
function artifact(sc){return sc.technical_artifact||"event, observation, evidence, and control records"}
function renderDashboard(){const stages=state.curriculum?.stages||[],done=stages.filter(x=>x.status==="completed").length,gates=state.gates.filter(x=>x.status==="complete").length,total=state.gates.length||75;$("dashboard-page").innerHTML=`<div class="hero"><span class="eyebrow">Virtual ledger · COMMAND CENTER · ${esc(state.currentStage||"RANGE COMPLETE")}</span><h1>Train the control boundary.</h1><p>Every lab is local, synthetic, and evidence-first. Choose a case, establish the baseline, and close with a verified control decision.</p><div class="hero-actions"><button class="btn btn-primary" data-go="catalog">Open lab range</button>${nextId()?`<button class="btn" data-go="detail">Continue current case</button>`:""}</div></div><div class="metric-grid"><div class="metric"><strong>${done}/${stages.length||10}</strong><span>Stages complete</span></div><div class="metric"><strong>${gates}/${total}</strong><span>Evidence gates</span></div><div class="metric"><strong>${all().length||150}</strong><span>Bounded labs</span></div><div class="metric"><strong>${esc(state.currentStage||"—")}</strong><span>Current stage</span></div></div><div class="dashboard-grid"><div class="card"><div class="card-header"><h2>Progression</h2></div><div class="card-body"><div style="display:flex;justify-content:space-between;margin-bottom:7px"><span class="muted">Curriculum progress</span><b>${Math.round(done/(stages.length||10)*100)}%</b></div><div class="progress-line"><span style="width:${Math.round(done/(stages.length||10)*100)}%"></span></div><div class="list" style="margin-top:14px">${stages.slice(0,10).map(s=>`<div class="list-row"><span>${esc(s.id)} · ${esc(slug(s.id))}</span><strong>${esc(s.status||"locked")}</strong></div>`).join("")}</div></div></div><div class="card"><div class="card-header" aria-label="current hard gate"><h2>Current hard gate</h2></div><div class="card-body">${currentGateHtml()}</div></div></div>`;$$('[data-go]').forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.go==="detail"?"detail":b.dataset.go)))}
function currentGateHtml(){const g=state.gates.find(x=>x.status==="unlocked")||state.gates.find(x=>x.status!=="complete");return g?`<span class="pill mint">${esc(g.gate_id)}</span><h3 style="color:var(--white);margin:12px 0 5px">${esc(g.title)}</h3><p class="muted">Complete the two declared labs, then synthesize independent evidence before advancing.</p>`:`<p class="muted">No active gate. Complete the current stage or review the range.</p>`}
function nextId(){const x=all().find(s=>status(s)!=="complete"&&status(s)!=="locked");return x?.scenario_id||all().find(s=>status(s)!=="locked")?.scenario_id||null}
function counts(){const x=all(),out={lane:{},stage:{},difficulty:{easy:0,medium:0,hard:0},status:{}};x.forEach(s=>{const l=s.technical_track||"incident-response";out.lane[l]=(out.lane[l]||0)+1;out.stage[s.stage_id]=(out.stage[s.stage_id]||0)+1;out.difficulty[band(s.difficulty)]++;out.status[status(s)]=(out.status[status(s)]||0)+1});return out}
function matches(s){const f=state.filters;const h=`${s.title} ${s.objective} ${s.scenario_id} ${s.technical_track} ${s.technical_artifact} ${(s.clues||[]).join(" ")}`.toLowerCase();return(f.stage==="all"||s.stage_id===f.stage)&&(f.lane==="all"||s.technical_track===f.lane)&&(f.difficulty==="all"||band(s.difficulty)===f.difficulty)&&(f.status==="all"||status(s)===f.status)&&(!f.q||h.includes(f.q))}
function renderCatalog(){const c=counts(),stages=state.range?.stages||[];$("catalog-page").innerHTML=`<div class="page-title"><div><span class="eyebrow">LAB RANGE · 150 BOUNDED INVESTIGATIONS</span><h1>Choose your control boundary.</h1><p>Filter by stage, technical lane, or state. Open a case only when you know what evidence you want to produce.</p></div></div><div class="range-map">${stages.map(s=>`<button class="stage ${stageStatus(s.stage_id)} ${state.filters.stage===s.stage_id?"selected":""}" data-stage="${esc(s.stage_id)}"><b>${esc(s.stage_id)}</b><strong>${esc(slug(s.stage_id))}</strong><small>${c.stage[s.stage_id]||0} labs</small><i></i></button>`).join("")}</div><div class="catalog-layout"><aside class="filters"><h2>Range filters</h2>${filterGroup("stage","Stage",[["all","All stages",all().length],...stages.map(s=>[s.stage_id,slug(s.stage_id),c.stage[s.stage_id]])])}${filterGroup("lane","Technical lane",[["all","All lanes",all().length],...Object.keys(c.lane).sort().map(x=>[x,slug(x),c.lane[x]])])}${filterGroup("difficulty","Difficulty",[["all","All levels"],["easy","Easy",c.difficulty.easy],["medium","Medium",c.difficulty.medium],["hard","Hard",c.difficulty.hard]])}${filterGroup("status","State",[["all","All states"],["not-started","Not started",c.status["not-started"]||0],["active","In progress",c.status.active||0],["complete","Completed",c.status.complete||0],["locked","Locked",c.status.locked||0]])}</aside><section><div class="catalog-head"><input class="input search" id="catalog-search" placeholder="Search title, objective, artifact, or lane…" value="${esc(state.filters.q)}" /><span id="catalog-count"></span></div><div id="lab-grid" class="lab-grid"></div><div id="pagination" class="pagination"></div></section></div>`;$("catalog-search").addEventListener("input",e=>{state.filters.q=e.target.value.toLowerCase();state.pageNo=1;renderCatalogGrid()});$$('[data-stage]').forEach(b=>b.addEventListener("click",()=>{state.filters.stage=b.dataset.stage;state.pageNo=1;renderCatalog()}));$$('[data-filter]').forEach(b=>b.addEventListener("click",()=>{state.filters[b.dataset.filter]=b.dataset.value;state.pageNo=1;renderCatalog()}));renderCatalogGrid()}
function filterGroup(key,title,items){return`<div class="filter-group"><h3>${title}</h3>${items.map(x=>`<button class="filter ${state.filters[key]===x[0]?"selected":""}" data-filter="${key}" data-value="${esc(x[0])}">${esc(x[1])}<small>${x[2]??""}</small></button>`).join("")}</div>`}
function renderCatalogGrid(){const list=all().filter(matches),size=9,total=Math.max(1,Math.ceil(list.length/size));state.pageNo=Math.min(state.pageNo||1,total);const page=list.slice((state.pageNo-1)*size,state.pageNo*size);$("catalog-count").textContent=`${list.length} matched · ${all().length} total`;$("lab-grid").innerHTML=page.length?page.map((s,i)=>`<article class="card lab-card" tabindex="0" data-id="${esc(s.scenario_id)}"><div class="lab-cover"><img src="/assets/covers/challenge-${String(all().findIndex(x=>x.scenario_id===s.scenario_id)+1).padStart(2,"0")}.png" alt="" loading="lazy" /><span class="lab-number">${esc(s.stage_id)} · ${String(all().findIndex(x=>x.scenario_id===s.scenario_id)+1).padStart(2,"0")}</span><span class="lab-status">${esc(status(s))}</span></div><div class="lab-card-body"><div class="lab-tags"><span class="tag mint">${esc(track(s))}</span><span class="tag">${esc(slug(s.branch))}</span><span class="tag">${band(s.difficulty)}</span></div><h3>${esc(s.title)}</h3><p>${esc(s.objective)}</p><div class="artifact"><b>Primary artifact</b>${esc(artifact(s))}</div></div></article>`).join(""):'<div class="card" style="grid-column:1/-1;padding:35px;text-align:center;color:var(--muted)">No labs match those filters.</div>';$$('[data-id]').forEach(b=>{const open=()=>openDetail(b.dataset.id);b.addEventListener("click",open);b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}})});$("pagination").innerHTML=Array.from({length:total},(_,i)=>`<button class="${i+1===state.pageNo?"active":""}" data-page="${i+1}">${i+1}</button>`).join("");$$('[data-page]').forEach(b=>b.addEventListener("click",()=>{state.pageNo=+b.dataset.page;renderCatalogGrid()}))}
async function openDetail(id){const s=all().find(x=>x.scenario_id===id);if(!s)return;if(status(s)==="locked"){toast("This lab is locked. Complete the current stage first.","error");return}state.selected=s;state.hint=null;setPage("detail");try{const data=await api(`/api/scenarios/${encodeURIComponent(id)}?learner_id=${encodeURIComponent(state.learner)}`);state.selected=data.scenario}catch(_){}renderDetail();if(state.scenarios.find(x=>x.scenario_id===id)?.status==="active")await refreshHint()}
function phaseIndex(s){const r=state.scenarios.find(x=>x.scenario_id===s.scenario_id);if(!r)return 0;if(r.status==="complete")return 2;const n=parseInt(String(r.progress).split("/")[0]||"0");return n===0?0:n>=s.step_count-1?2:1}
function renderDetail(){const s=state.selected;if(!s)return;const r=state.scenarios.find(x=>x.scenario_id===s.scenario_id),st=r?.status||"not-started",done=st==="complete"?s.step_count:parseInt(String(r?.progress||"0").split("/")[0])||0,ph=phaseIndex(s);$("detail-page").innerHTML=`<a href="#" class="back" id="back-catalog">← Back to lab range</a><div class="detail-top"><div><div class="detail-hero"><span class="eyebrow">${esc(s.stage_id)} · ${esc(track(s))}</span><h1>${esc(s.title)}</h1><p>${esc(s.objective)}</p><div class="meta-row"><span class="pill mint">${esc(statusLabel(st))}</span><span class="pill amber">${band(s.difficulty)} · ${points(s)} pts</span><span class="pill">${esc(slug(s.branch))}</span></div></div><div class="detail-command"><div><span class="status-dot ${st==="complete"?"ready":st==="active"?"warn":""}"></span><b>${done}/${s.step_count} steps</b></div><div class="phase-track">${["Orient","Investigate","Verify"].map((x,i)=>`<span class="phase ${i<=ph?"reached":""}">${x}<small>${["baseline","controlled evidence","closure proof"][i]}</small></span>`).join("")}</div><div class="artifact"><b>Work product</b>${esc(artifact(s))}</div></div><div class="detail-columns"><section class="card section-card"><h2>Mission brief</h2><div><div class="brief-grid"><div class="brief"><b>Objective</b><strong>${esc(s.objective)}</strong></div><div class="brief"><b>Technical lane</b><p>${esc(track(s))}</p><p style="margin-top:5px">${esc(artifact(s))}</p></div></div><div class="chain" style="margin-top:12px">${(s.clues||[]).map((x,i)=>`<div class="chain-row"><b>${String(i+1).padStart(2,"0")}</b><div><h3>${esc(["Start here","Controlled change","Closure condition"][i]||`Signal ${i+1}`)}</h3><p>${esc(x)}</p></div></div>`).join("")}</div></div></section><section class="card section-card"><h2>Solution studio</h2><div class="solution">${solutionHtml(s)}</div></section><section class="card section-card"><h2>Evidence chain</h2><div id="evidence-list" class="evidence-list"></div></section></div></div><aside class="side"><section class="card access"><h2>Open the lab surface</h2><p>Start locally, inspect the disclosed target, and submit one evidence event at a time.</p><div class="target-list">${(s.target_services||[]).map(x=>`<a class="target" target="_blank" rel="noopener" href="${esc(`${protocol}//${host}:${({"training-challenges":8060,"training-gate":5050,aurora:5000,phoenix:5001,assistant:5002}[x]||8060)}`)}"><span>${esc(x)}</span><span>open ↗</span></a>`).join("")}</div><div id="lab-actions"></div></section><section class="card access"><h2>Hard-gate synthesis</h2><div id="synthesis-box">${synthesisHtml()}</div></section><section class="card access"><h2>Advance</h2><div class="gate-form"><input class="input" id="flag-input" placeholder="ZODIAC-BANK-…" /><button class="btn btn-primary" id="flag-btn">Submit discovered flag</button><div id="flag-result"></div></div></section></aside></div>`;$("back-catalog").addEventListener("click",e=>{e.preventDefault();setPage("catalog")});renderLabActions(s);renderEvidence(s);$("flag-btn").addEventListener("click",submitFlag);$("synth-btn")?.addEventListener("click",runSynthesis)}
function statusLabel(s){return{"not-started":"Not started",active:"In progress",complete:"Completed",locked:"Locked"}[s]||s}
function solutionHtml(s){const g=s.solution_guide||{},steps=g.steps||[],rb=g.runbook||{};return`<p class="muted">${esc(g.intro||"Run the local procedure, preserve the declared evidence, and submit events in order.")}</p>${steps.map(x=>`<article class="solution-step"><h3>${String(x.step).padStart(2,"0")} · ${esc(x.title)}</h3><p>${esc(x.text||x.look_for||"")}</p><p><b>Operator move:</b> ${esc(x.action||"Inspect the local surface")}</p><code>${esc(x.request||"")}</code><p class="tiny">Evidence: ${esc((x.evidence_keys||[]).join(" · ")||"bounded observation")}</p></article>`).join("")}<p class="muted"><b>Verify:</b> ${esc(rb.verification||"Repeat the same local request and reconcile the redacted response with the controls.")}</p>`}
function renderLabActions(s){const r=state.scenarios.find(x=>x.scenario_id===s.scenario_id),box=$("lab-actions");if(r?.status==="complete"){box.innerHTML='<span class="pill mint">Scenario complete · token ready</span>';return}if(r?.status==="active"){box.innerHTML='<button class="btn btn-danger" id="reset-btn">Reset this run</button>';$("reset-btn").addEventListener("click",resetRun)}else{box.innerHTML='<button class="btn btn-primary" id="start-btn">Start this lab</button>';$("start-btn").addEventListener("click",startRun)}}
function renderEvidence(s){const box=$("evidence-list"),r=state.scenarios.find(x=>x.scenario_id===s.scenario_id),cur=r?.status==="active"?parseInt(String(r.progress).split("/")[0])||0:-1;box.innerHTML=Array.from({length:s.step_count||1},(_,i)=>{const done=r?.status==="complete"||i<cur,active=i===cur;return`<article class="evidence-step ${done?"done":""} ${active?"current":""}"><div class="evidence-head"><strong>STEP ${String(i+1).padStart(2,"0")}</strong><span>${done?"accepted":active?"current":"locked"}</span></div>${active&&state.hint?`<p>${esc(state.hint.observation||"")}<br><code>${esc(state.hint.event||"")}</code></p><div class="choices">${Object.entries(state.hint.candidates||{}).filter(([k])=>k!=="proof").flatMap(([k,v])=>(v.candidates||[]).map(c=>`<button class="choice candidate-chip" data-contract="evidence" data-key="${esc(k)}" data-value="${esc(c)}">${esc(k)}: ${esc(c)}</button>`)).join("")}</div><button class="btn btn-primary" id="evidence-submit" style="margin-top:10px">Submit selected evidence</button>`:`<p>${done?"Evidence accepted for this step.":active?"Loading the current step…":"Complete the previous step to unlock it."}</p>`}</article>`}).join("");$$('[data-key]').forEach(b=>b.addEventListener("click",()=>{const same=$$(`[data-key="${CSS.escape(b.dataset.key)}"]`);same.forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}));$("evidence-submit")?.addEventListener("click",submitEvidence)}
async function refreshHint(){try{state.hint=await api(`/api/scenarios/${encodeURIComponent(state.selected.scenario_id)}/hint?learner_id=${encodeURIComponent(state.learner)}`);renderDetail()}catch(e){toast(e.message,"error")}}
async function startRun(){try{await api(`/api/scenarios/${encodeURIComponent(state.selected.scenario_id)}/start`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({learner_id:state.learner})});await refreshStage();toast("Lab started. Capture the baseline first.","ok")}catch(e){toast(e.message,"error")}}
async function resetRun(){try{await api(`/api/scenarios/${encodeURIComponent(state.selected.scenario_id)}/reset`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({learner_id:state.learner})});await refreshStage();toast("Run reset.","ok")}catch(e){toast(e.message,"error")}}
async function submitEvidence(){const evidence={};$$('#evidence-list .choice.selected').forEach(b=>evidence[b.dataset.key]=b.dataset.value);if(state.hint?.candidates?.proof?.correct)evidence.proof=state.hint.candidates.proof.correct;try{const r=await api(`/api/scenarios/${encodeURIComponent(state.selected.scenario_id)}/event`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({learner_id:state.learner,event:state.hint.event,evidence})});await refreshStage();toast(r.message||"Evidence accepted.","ok")}catch(e){toast(`Evidence rejected: ${e.message}`,"error")}}
function synthesisHtml(){const g=state.gates.find(x=>x.status==="unlocked");if(!g)return'<p class="muted">Complete the current hard-gate labs to unlock synthesis.</p>';const ready=g.scenario_ids.every(id=>state.scenarios.find(s=>s.scenario_id===id)?.status==="complete");return`<span class="pill ${ready?"mint":"amber"}">${esc(g.gate_id)} · ${ready?"Ready":"Pending labs"}</span><p class="muted" style="margin:9px 0">${esc(g.title)}</p>${ready?`<textarea class="input" id="summary-input" placeholder="Describe the incident, evidence, and controls…"></textarea><textarea class="input" id="timeline-input" placeholder="One timeline event per line…" style="margin-top:8px"></textarea><button class="btn btn-primary" id="synth-btn" style="margin-top:8px">Run synthesis</button>`:""}`}
async function runSynthesis(){const g=state.gates.find(x=>x.status==="unlocked");try{const r=await api(`/api/gates/${encodeURIComponent(g.gate_id)}/synthesize`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({learner_id:state.learner,scenario_ids:g.scenario_ids,evidence_tokens:g.scenario_ids.map(id=>state.scenarios.find(s=>s.scenario_id===id)?.completion_token||""),detection_rule_ids:g.detection_rule_ids,controls:g.required_controls,summary:$("summary-input").value,timeline:$("timeline-input").value.split("\n").map(x=>x.trim()).filter(Boolean)})});toast(r.message||"Synthesis accepted.","ok");await refreshStage()}catch(e){toast(e.message,"error")}}
async function submitFlag(){const flag=$("flag-input").value.trim();if(!flag)return;try{const g=state.gates.find(x=>x.status==="unlocked");const r=await gateApi("/api/gates/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({learner_id:state.learner,gate_id:g?.gate_id,flag})});toast(r.message||"Flag accepted.","ok");await boot()}catch(e){$("flag-result").innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function refreshStage(){const d=await api(`/api/scenarios?learner_id=${encodeURIComponent(state.learner)}`);if(d.status==="complete"){state.currentStage=null;state.scenarios=[];state.gates=[];return}state.currentStage=d.stage_id;state.scenarios=d.scenarios;const g=await api(`/api/gates?learner_id=${encodeURIComponent(state.learner)}`);state.gates=g.gates||[]}
async function boot(){const r=await api(`/api/range?learner_id=${encodeURIComponent(state.learner)}`);state.range=r;state.currentStage=r.current_stage_id;const [c]=await Promise.all([gateApi(`/api/curriculum?learner_id=${encodeURIComponent(state.learner)}`),refreshStage()]);state.curriculum=c;$("user-pill").textContent=state.learner;$("mode-pill").textContent="STRICT RANGE";setPage(state.page)}
async function login(){const id=$("learner-id").value.trim(),token=$("learner-token").value.trim();if(!id||!token){$("login-error").textContent="Learner ID and token are required.";$("login-error").classList.remove("hidden");return}state.learner=id;state.token=token;state.gateUrl=$("gate-url").value.trim()||defaultGate;try{await boot();save();$("login-view").classList.add("hidden");$("app-view").classList.remove("hidden");toast("Range loaded.","ok")}catch(e){$("login-error").textContent=e.message;$("login-error").classList.remove("hidden")}}
function logout(){localStorage.removeItem("zb-range");location.reload()}
load();$("probe-btn").addEventListener("click",probe);probe();$("login-btn").addEventListener("click",login);$("logout-btn").addEventListener("click",logout);$$('.nav button').forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));setPage("dashboard");
</script>

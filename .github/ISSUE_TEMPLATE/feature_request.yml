name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! A clear problem statement helps us evaluate it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Why is it valuable?
      placeholder: "A newcomer can't ... because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should we build or change?
      placeholder: "Add a ... that lets ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or related issues.

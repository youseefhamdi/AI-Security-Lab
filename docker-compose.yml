services:
  # ============= LAYER 1: API GATEWAY =============
  kong-database:
    image: postgres:13-alpine
    container_name: lab-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  kong-migration:
    image: kong:3.9
    container_name: lab-kong-migration
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kongpass
    restart: on-failure

  kong:
    image: kong:3.9
    container_name: lab-kong
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8443:8443"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kongpass
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    depends_on:
      kong-migration:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ============= LAYER 2: INFERENCE =============
  # Models must already exist in the local Ollama volume or ./models/.
  # This Compose file intentionally contains no model-pull service or command.
  ollama-llama:
    image: ollama/ollama:latest
    container_name: lab-ollama-llama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_llama_data:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12

  bonsai:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: lab-bonsai
    ports:
      - "127.0.0.1:11435:8000"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/bonsai-27b.gguf
      --host 0.0.0.0 --port 8000
      -c 8192
      --jinja
      -ngl 0
    deploy:
      resources:
        limits:
          memory: 10G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ============= LAYER 3: DATA SERVICES =============
  chromadb:
    image: chromadb/chroma:latest
    container_name: lab-chromadb
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - chroma_data:/chroma/chroma
      - ./rag-docs:/data:ro
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # ============= LAYER 4: PROTOCOL SERVERS =============
  mcp-server:
    build: ./mcp-server
    container_name: lab-mcp-server
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MCP_LEAK_SCHEMAS: "true"
      SENSITIVE_DATA_DIR: /opt/sensitive-data
    volumes:
      - ./sensitive-data:/opt/sensitive-data:ro
      - ./orchestrator-config:/opt/orchestrator-config:ro

  mcp-wrapper:
    build: ./mcp-wrapper
    container_name: lab-mcp-wrapper
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MCP_UPSTREAM: http://mcp-server:3000
      MCP_WRAPPER_MODE: lab

  a2a-agent:
    build: ./a2a-agent
    container_name: lab-a2a-agent
    ports:
      - "127.0.0.1:4000:4000"

  # ============= LAYER 5: APPLICATIONS =============
  aurora:
    build: ./apps/aurora
    container_name: lab-aurora
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      OLLAMA_HOST: http://ollama-llama:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      MCP_SERVER: http://mcp-server:3000
      MODEL_NAME: ${LLAMA_MODEL:-llama3.2:1b}
    depends_on:
      ollama-llama:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  phoenix:
    build: ./apps/phoenix
    container_name: lab-phoenix
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      OPENAI_BASE_URL: http://bonsai:8000/v1
      CHROMA_HOST: chromadb
      MODEL_NAME: ${BONSAI_API_MODEL:-bonsai}
    depends_on:
      bonsai:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  assistant:
    build: ./apps/assistant
    container_name: lab-assistant
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      OLLAMA_HOST: http://ollama-llama:11434
      MODEL_NAME: ${LLAMA_MODEL:-llama3.2:1b}
    depends_on:
      ollama-llama:
        condition: service_healthy

  # ============= LAYER 6: ORCHESTRATION =============
  a2a-router:
    build: ./a2a-agents/router
    container_name: lab-a2a-router
    ports:
      - "127.0.0.1:4100:5010"
    environment:
      A2A_KNOWLEDGE_AGENT: http://a2a-knowledge:5011
      A2A_SUPPORT_AGENT: http://a2a-agent:4000
      ORCHESTRATOR_CONFIG: /opt/orchestrator-config
    volumes:
      - ./orchestrator-config:/opt/orchestrator-config:ro
    depends_on:
      - a2a-agent
      - a2a-knowledge

  a2a-knowledge:
    build: ./a2a-agents/knowledge
    container_name: lab-a2a-knowledge
    ports:
      - "127.0.0.1:4101:5011"
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      COLLECTION_NAME: novatech_docs
    depends_on:
      chromadb:
        condition: service_healthy

  # ============= LAYER 7: SECURITY LAB FIXTURES =============
  redteam-fixtures:
    image: alpine:3.20
    container_name: lab-redteam-fixtures
    command: ["sh", "-c", "sleep infinity"]
    volumes:
      - ./sensitive-data:/opt/sensitive-data:ro
      - ./exercises:/opt/exercises:ro
    profiles: ["lab"]

  # ============= LAYER 8: SIEM STORAGE =============
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: lab-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ============= LAYER 9: SIEM UI AND LOG SHIPPING =============
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: lab-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: lab-filebeat
    user: root
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  kong_data:
  ollama_llama_data:
  chroma_data:
  redis_data:
  es_data:

version: '3.8'

services:
  # ============= LAYER 1: GATEWAY =============
  kong-database:
    image: postgres:13-alpine
    container_name: lab-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - kong_data:/var/lib/postgresql/data

  kong-migration:
    image: kong:3.9
    container_name: lab-kong-migration
    command: kong migrations bootstrap
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kongpass
    restart: on-failure

  kong:
    image: kong:3.9
    container_name: lab-kong
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kongpass
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    depends_on:
      - kong-migration

  # ============= LAYER 2: INFERENCE =============
  # Models are expected to be preloaded locally. No pull command is defined here.
  ollama-llama:
    image: ollama/ollama:latest
    container_name: lab-ollama-llama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_llama_data:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        limits:
          memory: 8G

  bonsai:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: lab-bonsai
    ports:
      - "127.0.0.1:11435:8000"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/bonsai-27b.gguf
      --host 0.0.0.0 --port 8000
      -c 8192
      --jinja
      -ngl 0
    deploy:
      resources:
        limits:
          memory: 10G

  # ============= LAYER 3: STORAGE =============
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: lab-milvus
    ports:
      - "127.0.0.1:19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    deploy:
      resources:
        limits:
          memory: 4G

  chromadb:
    image: chromadb/chroma:latest
    container_name: lab-chromadb
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - chroma_data:/chroma/chroma
      - ./rag-docs:/data:ro

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    ports:
      - "127.0.0.1:6379:6379"

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lab-lightrag
    ports:
      - "127.0.0.1:9621:9621"
    volumes:
      - lightrag_data:/app/data
      - ./rag-docs:/app/rag-docs:ro
    environment:
      LLM_MODEL: ollama/llama3.2:1b
      LLM_BINDING_HOST: http://ollama-llama:11434
      LLM_BINDING: ollama
      EMBEDDING_MODEL: ollama/nomic-embed-text
      EMBEDDING_BINDING: ollama
      EMBEDDING_BINDING_HOST: http://ollama-llama:11434
      EMBEDDING_DIM: "768"
      KV_STORAGE: file
      VECTOR_STORAGE: file
      GRAPH_STORAGE: file
      DOC_STATUS_STORAGE: file
    depends_on:
      - ollama-llama

  # ============= LAYER 4: MEMORY =============
  mem0:
    image: mem0/mem0-api-server:latest
    container_name: lab-mem0
    ports:
      - "127.0.0.1:8888:8000"
    volumes:
      - mem0_data:/app/data
      - ./mem0-config:/app/config:ro
    environment:
      # Mem0 OSS API server: auth is enabled by default.
      ADMIN_API_KEY: ${MEM0_ADMIN_API_KEY:-mem0_lab_admin_key_change_me}
      JWT_SECRET: ${MEM0_JWT_SECRET:-mem0_lab_jwt_secret_change_me}
      LLM_PROVIDER: ollama
      LLM_MODEL: llama3.2:1b
      LLM_BASE_URL: http://ollama-llama:11434
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_BASE_URL: http://ollama-llama:11434
    depends_on:
      - ollama-llama

  # ============= LAYER 5: PROTOCOLS =============
  mcp-server:
    build: ./mcp-server
    container_name: lab-mcp-server
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MCP_LEAK_SCHEMAS: "true"
      SENSITIVE_DATA_DIR: /opt/sensitive-data
    volumes:
      - ./sensitive-data:/opt/sensitive-data:ro
      - ./orchestrator-config:/opt/orchestrator-config:ro

  mcp-wrapper:
    build: ./mcp-wrapper
    container_name: lab-mcp-wrapper
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MCP_UPSTREAM: http://mcp-server:3000
      MCP_WRAPPER_MODE: lab

  mcp-memory:
    image: mcp/memory:latest
    container_name: lab-mcp-memory
    command: ["npx", "-y", "@modelcontextprotocol/server-memory"]
    ports:
      - "127.0.0.1:3004:3000"

  mcp-filesystem:
    image: mcp/filesystem:latest
    container_name: lab-mcp-filesystem
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/data"]
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./sensitive-data:/data:ro

  mcp-fetch:
    image: mcp/fetch:latest
    container_name: lab-mcp-fetch
    command: ["npx", "-y", "@modelcontextprotocol/server-fetch"]
    ports:
      - "127.0.0.1:3003:3000"

  a2a-agent:
    build: ./a2a-agent
    container_name: lab-a2a-agent
    ports:
      - "127.0.0.1:4000:4000"

  a2a-router:
    build: ./a2a-agents/router
    container_name: lab-a2a-router
    ports:
      - "127.0.0.1:5010:5000"
    environment:
      AGENT_NAME: Support Router
      PUBLIC_URL: http://127.0.0.1:5010
      KNOWLEDGE_AGENT_URL: http://a2a-knowledge:5000
      OLLAMA_HOST: http://ollama-llama:11434
    depends_on:
      - ollama-llama
      - a2a-knowledge

  a2a-knowledge:
    build: ./a2a-agents/knowledge
    container_name: lab-a2a-knowledge
    ports:
      - "127.0.0.1:5011:5000"
    environment:
      AGENT_NAME: Knowledge Agent
      PUBLIC_URL: http://127.0.0.1:5011
      LIGHTRAG_URL: http://lightrag:9621
      OLLAMA_HOST: http://ollama-llama:11434
    depends_on:
      - lightrag
      - ollama-llama

  # ============= LAYER 6: APPS =============
  aurora:
    build: ./apps/aurora
    container_name: lab-aurora
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      OLLAMA_HOST: http://ollama-llama:11434
      LIGHTRAG_URL: http://lightrag:9621
      MEM0_URL: http://mem0:8000
      MEM0_API_KEY: ${MEM0_ADMIN_API_KEY:-mem0_lab_admin_key_change_me}
      MODEL_NAME: llama3.2:1b
    depends_on:
      - ollama-llama
      - lightrag
      - mem0

  phoenix:
    build: ./apps/phoenix
    container_name: lab-phoenix
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      OPENAI_BASE_URL: http://bonsai:8000/v1
      MODEL_NAME: bonsai-27b
      LIGHTRAG_URL: http://lightrag:9621
      MEM0_URL: http://mem0:8000
    depends_on:
      - bonsai
      - lightrag
      - mem0

  assistant:
    build: ./apps/assistant
    container_name: lab-assistant
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      OLLAMA_HOST: http://ollama-llama:11434
      MODEL_NAME: llama3.2:1b
    depends_on:
      - ollama-llama

  # ============= LAYER 9: SIEM =============
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: lab-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 2G

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: lab-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: lab-filebeat
    user: root
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs:ro
    depends_on:
      - elasticsearch

volumes:
  kong_data:
  ollama_llama_data:
  milvus_data:
  chroma_data:
  lightrag_data:
  mem0_data:
  es_data:
  redis_data:

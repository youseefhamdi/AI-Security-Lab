version: '3.8'
name: zodiac-bank-ai-security-lab

services:
  # ============= CORE: AUTO-SELECTED INFERENCE BACKEND =============
  # Bonsai is the local fallback. start_all.sh can reuse Ollama, LM Studio,
  # or an existing OpenAI-compatible llama.cpp provider instead.
  bonsai:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: lab-bonsai
    ports:
      - "127.0.0.1:11435:8000"
    volumes:
      - ${BONSAI_MODEL_DIR:-./models}:/models:ro
    environment:
      BONSAI_MODEL_FILE: ${BONSAI_MODEL_FILE:-bonsai-27b.gguf}
    command: >
      -m /models/${BONSAI_MODEL_FILE:-bonsai-27b.gguf}
      --host 0.0.0.0 --port 8000
      -c ${BONSAI_CONTEXT_SIZE:-2048}
      --parallel ${BONSAI_PARALLEL:-1}
      --jinja
      -ngl ${BONSAI_GPU_LAYERS:-0}
    mem_limit: ${BONSAI_MEMORY_LIMIT:-5G}
    deploy:
      resources:
        limits:
          memory: ${BONSAI_MEMORY_LIMIT:-5G}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  training-gate:
    build:
      context: .
      dockerfile: training-gate/Dockerfile
    container_name: zodiac-bank-training-gate
    ports:
      - "127.0.0.1:5050:5050"
    environment:
      TRAINING_CURRICULUM: /app/config/curriculum.json
      TRAINING_SCENARIOS: /app/config/scenarios.json
      TRAINING_STATE_DB: /var/lib/training/progress.sqlite3
      TRAINING_FLAG_SECRET: ${TRAINING_FLAG_SECRET:-zodiac-bank-change-this-training-secret}
      TRAINING_ADMIN_KEY: ${TRAINING_ADMIN_KEY:-zodiac-bank-admin-change-me}
      TRAINING_SECURITY_MODE: ${TRAINING_SECURITY_MODE:-strict}
      TRAINING_MAX_SUBMISSIONS: ${TRAINING_MAX_SUBMISSIONS:-20}
      TRAINING_FLAG_COOLDOWN_SECONDS: ${TRAINING_FLAG_COOLDOWN_SECONDS:-0}
      TRAINING_ARTIFACT_DIR: /var/lib/training/learners
      TRAINING_BANK_PROFILES: /app/config/bank-profiles.json
    volumes:
      - ./training-config:/app/config:ro
      - training_data:/var/lib/training
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m

  training-challenges:
    build:
      context: .
      dockerfile: training-challenges/Dockerfile
    container_name: zodiac-bank-challenges
    ports:
      # Host port 8060 (not 5060): Chrome blocks 5060 (SIP) with ERR_UNSAFE_PORT.
      # The container still listens on 5060 internally.
      - "127.0.0.1:8060:5060"
    environment:
      TRAINING_FLAG_SECRET: ${TRAINING_FLAG_SECRET:-zodiac-bank-change-this-training-secret}
      TRAINING_SECURITY_MODE: ${TRAINING_SECURITY_MODE:-strict}
      TRAINING_ACCESS_DB: /var/lib/training/progress.sqlite3
      TRAINING_CHALLENGE_STATE_DB: /var/lib/training/challenges.sqlite3
      TRAINING_BANK_PROFILES: /app/config/bank-profiles.json
      ZODIAC_AGENT_SIGNING_KEY: ${ZODIAC_AGENT_SIGNING_KEY:-zodiac-bank-agent-signing-key-change-me}
      ZODIAC_BANK_DATA_DIR: /app/bank-data
      ZODIAC_RAG_DIR: /app/rag-docs
    volumes:
      - training_data:/var/lib/training
      # Live-reload the trainer UI: the HTML is bind-mounted read-only so a
      # git pull updates the interface without rebuilding the image. The same
      # applies to the cinematic brand assets served under /docs/assets.
      - ./training-challenges/index.html:/app/index.html:ro
      - ./training-challenges/assets/flows:/app/assets/flows:ro
      - ./docs/assets:/app/docs/assets:ro
    mem_limit: 128m

  zodiac-context:
    build:
      context: .
      dockerfile: graph-context/Dockerfile
    container_name: zodiac-bank-graph-context
    ports:
      - "127.0.0.1:5070:5070"
    environment:
      GRAPH_CONTEXT_SECURITY_MODE: ${GRAPH_CONTEXT_SECURITY_MODE:-strict}
      GRAPH_CONTEXT_API_KEY: ${GRAPH_CONTEXT_API_KEY:-zodiac-bank-context-change-me}
    volumes:
      - ./bank-data:/app/bank-data:ro
      - ./rag-docs:/app/rag-docs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5070/health', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s

  mcp-server:
    profiles: ["protocols", "full"]
    build: ./mcp-server
    container_name: lab-mcp-server
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MCP_LEAK_SCHEMAS: "true"
      SENSITIVE_DATA_DIR: /opt/sensitive-data
    volumes:
      - ./sensitive-data:/opt/sensitive-data:ro
      - ./orchestrator-config:/opt/orchestrator-config:ro
    mem_limit: 256m

  mcp-wrapper:
    profiles: ["protocols", "full"]
    build:
      context: .
      dockerfile: mcp-wrapper/Dockerfile
    container_name: lab-mcp-wrapper
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MCP_UPSTREAM: http://mcp-server:3000
      MCP_WRAPPER_MODE: lab
      AGENT_SECURITY_MODE: ${AGENT_SECURITY_MODE:-strict}
      ZODIAC_AGENT_SIGNING_KEY: ${ZODIAC_AGENT_SIGNING_KEY:-zodiac-bank-agent-signing-key-change-me}
      MCP_SECURE_ALLOWED_TOOLS: ${MCP_SECURE_ALLOWED_TOOLS:-memory}
      MCP_SECURE_STDIO_ENABLED: ${MCP_SECURE_STDIO_ENABLED:-0}
      MCP_SANDBOX_ENABLED: ${MCP_SANDBOX_ENABLED:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    depends_on:
      - mcp-server

  a2a-knowledge:
    profiles: ["protocols", "full"]
    build:
      context: .
      dockerfile: a2a-agents/knowledge/Dockerfile
    container_name: lab-a2a-knowledge
    ports:
      - "127.0.0.1:5011:5000"
    environment:
      AGENT_NAME: Knowledge Agent
      PUBLIC_URL: http://127.0.0.1:5011
      OPENAI_BASE_URL: ${INFERENCE_BASE_URL:-http://bonsai:8000/v1}
      MODEL_NAME: ${INFERENCE_MODEL:-bonsai-27b}
      RAG_DOCS_DIR: /app/rag-docs
      ENABLE_EXTERNAL_CONTEXT: ${ENABLE_EXTERNAL_CONTEXT:-0}
      LIGHTRAG_URL: ${LIGHTRAG_URL:-http://lightrag:9621}
      VECTOR_RAG_ENABLED: ${VECTOR_RAG_ENABLED:-0}
      CHROMA_API_URL: ${CHROMA_CONTAINER_API_URL:-http://chromadb:8000/api/v1}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-zodiac_bank_docs}
      CHROMA_TOP_K: ${CHROMA_TOP_K:-4}
      EMBEDDING_BASE_URL: ${EMBEDDING_CONTAINER_BASE_URL:-${EMBEDDING_BASE_URL:-}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-mpnet-base-v2}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      GRAPH_CONTEXT_ENABLED: ${GRAPH_CONTEXT_ENABLED:-1}
      GRAPH_CONTEXT_URL: ${GRAPH_CONTEXT_CONTAINER_URL:-http://zodiac-context:5070}
      GRAPH_CONTEXT_API_KEY: ${GRAPH_CONTEXT_API_KEY:-zodiac-bank-context-change-me}
      CONTEXT_ENGINEERING_MODE: ${CONTEXT_ENGINEERING_MODE:-structured}
      CONTEXT_MAX_CHARS: ${CONTEXT_MAX_CHARS:-12000}
      ZODIAC_AGENT_SIGNING_KEY: ${ZODIAC_AGENT_SIGNING_KEY:-zodiac-bank-agent-signing-key-change-me}
    volumes:
      - ./rag-docs:/app/rag-docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      zodiac-context:
        condition: service_healthy
    mem_limit: 256m

  a2a-router:
    profiles: ["protocols", "full"]
    build:
      context: .
      dockerfile: a2a-agents/router/Dockerfile
    container_name: lab-a2a-router
    ports:
      - "127.0.0.1:5010:5000"
    environment:
      AGENT_NAME: Support Router
      PUBLIC_URL: http://127.0.0.1:5010
      KNOWLEDGE_AGENT_URL: http://a2a-knowledge:5000
      OPENAI_BASE_URL: ${INFERENCE_BASE_URL:-http://bonsai:8000/v1}
      MODEL_NAME: ${INFERENCE_MODEL:-bonsai-27b}
      AGENT_SECURITY_MODE: ${AGENT_SECURITY_MODE:-strict}
      ZODIAC_AGENT_SIGNING_KEY: ${ZODIAC_AGENT_SIGNING_KEY:-zodiac-bank-agent-signing-key-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    depends_on:
      - a2a-knowledge

  aurora:
    build: ./apps/aurora
    container_name: lab-aurora
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      OPENAI_BASE_URL: ${INFERENCE_BASE_URL:-http://bonsai:8000/v1}
      MODEL_NAME: ${INFERENCE_MODEL:-bonsai-27b}
      RAG_DOCS_DIR: /app/rag-docs
      ENABLE_EXTERNAL_CONTEXT: ${ENABLE_EXTERNAL_CONTEXT:-0}
      LIGHTRAG_URL: ${LIGHTRAG_URL:-http://lightrag:9621}
      VECTOR_RAG_ENABLED: ${VECTOR_RAG_ENABLED:-0}
      CHROMA_API_URL: ${CHROMA_CONTAINER_API_URL:-http://chromadb:8000/api/v1}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-zodiac_bank_docs}
      CHROMA_TOP_K: ${CHROMA_TOP_K:-4}
      EMBEDDING_BASE_URL: ${EMBEDDING_CONTAINER_BASE_URL:-${EMBEDDING_BASE_URL:-}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-mpnet-base-v2}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      MEM0_URL: ${MEM0_URL:-http://mem0:8000}
      MEM0_API_KEY: ${MEM0_ADMIN_API_KEY:-mem0_lab_admin_key_change_me}
      GRAPH_CONTEXT_ENABLED: ${GRAPH_CONTEXT_ENABLED:-1}
      GRAPH_CONTEXT_URL: ${GRAPH_CONTEXT_CONTAINER_URL:-http://zodiac-context:5070}
      GRAPH_CONTEXT_API_KEY: ${GRAPH_CONTEXT_API_KEY:-zodiac-bank-context-change-me}
      CONTEXT_ENGINEERING_MODE: ${CONTEXT_ENGINEERING_MODE:-structured}
      CONTEXT_MAX_CHARS: ${CONTEXT_MAX_CHARS:-12000}
      ZODIAC_AGENT_SIGNING_KEY: ${ZODIAC_AGENT_SIGNING_KEY:-zodiac-bank-agent-signing-key-change-me}
    volumes:
      - ./rag-docs:/app/rag-docs:ro
      # Live-reload the Aurora UI (bind-mounted, no rebuild needed).
      - ./apps/aurora/index.html:/app/index.html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      zodiac-context:
        condition: service_healthy
    mem_limit: 256m

  phoenix:
    build: ./apps/phoenix
    container_name: lab-phoenix
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      OPENAI_BASE_URL: ${INFERENCE_BASE_URL:-http://bonsai:8000/v1}
      MODEL_NAME: ${INFERENCE_MODEL:-bonsai-27b}
    volumes:
      # Live-reload the Phoenix UI (bind-mounted, no rebuild needed).
      - ./apps/phoenix/index.html:/app/index.html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m

  assistant:
    build: ./apps/assistant
    container_name: lab-assistant
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      OPENAI_BASE_URL: ${INFERENCE_BASE_URL:-http://bonsai:8000/v1}
      MODEL_NAME: ${INFERENCE_MODEL:-bonsai-27b}
    volumes:
      # Live-reload the Assistant UI (bind-mounted, no rebuild needed).
      - ./apps/assistant/index.html:/app/index.html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m

  # ============= FULL PROFILE: GATEWAY =============
  kong-database:
    profiles: ["full"]
    image: postgres:13-alpine
    container_name: lab-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    volumes:
      - kong_data:/var/lib/postgresql/data

  kong-migration:
    profiles: ["full"]
    image: kong:3.9
    container_name: lab-kong-migration
    command: kong migrations bootstrap
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kongpass
    restart: on-failure

  kong:
    profiles: ["full"]
    image: kong:3.9
    container_name: lab-kong
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kongpass
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    depends_on:
      - kong-migration

  # ============= FULL PROFILE: STORAGE =============
  chromadb:
    profiles: ["full"]
    image: chromadb/chroma:latest
    container_name: lab-chromadb
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - chroma_data:/chroma/chroma
      - ./rag-docs:/data:ro

  milvus:
    profiles: ["full"]
    image: milvusdb/milvus:v2.4.0
    container_name: lab-milvus
    ports:
      - "127.0.0.1:19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    deploy:
      resources:
        limits:
          memory: 3G

  redis:
    profiles: ["full"]
    image: redis:7-alpine
    container_name: lab-redis
    ports:
      - "127.0.0.1:6379:6379"

  # LightRAG is optional in lite mode. It still needs a compatible embedding
  # provider; Bonsai itself is a generator and does not expose embeddings.
  lightrag:
    profiles: ["full"]
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lab-lightrag
    ports:
      - "127.0.0.1:9621:9621"
    volumes:
      - lightrag_data:/app/data
      - ./rag-docs:/app/rag-docs:ro
    environment:
      PORT: "9621"
      LLM_MODEL: ${INFERENCE_MODEL:-bonsai-27b}
      LLM_BINDING_HOST: ${INFERENCE_BASE_URL:-http://bonsai:8000/v1}
      LLM_BINDING: openai
      LLM_BINDING_API_KEY: local
      # Set these in .env for full-mode graph embeddings. Bonsai is text-only.
      EMBEDDING_BINDING: ${LIGHTRAG_EMBEDDING_BINDING:-openai}
      EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_BINDING_HOST: ${LIGHTRAG_EMBEDDING_HOST:-https://api.openai.com/v1}
      EMBEDDING_BINDING_API_KEY: ${LIGHTRAG_EMBEDDING_API_KEY:-}
      EMBEDDING_DIM: ${LIGHTRAG_EMBEDDING_DIM:-1536}
      KV_STORAGE: file
      VECTOR_STORAGE: file
      GRAPH_STORAGE: file
      DOC_STATUS_STORAGE: file
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The stock Mem0 API image is optional because its bundled server providers
  # do not include Ollama. Use a locally customized Mem0 image for full mode.
  mem0:
    profiles: ["full"]
    image: mem0/mem0-api-server:latest
    container_name: lab-mem0
    ports:
      - "127.0.0.1:8888:8000"
    volumes:
      - mem0_data:/app/data
      - ./mem0-config:/app/config:ro
    environment:
      # Mem0 uses the OpenAI-compatible client for its LLM. Bonsai can provide
      # generation locally; embeddings still need a configured embedding model.
      OPENAI_API_KEY: ${MEM0_LLM_API_KEY:-local}
      OPENAI_BASE_URL: ${MEM0_LLM_BASE_URL:-${INFERENCE_BASE_URL:-http://bonsai:8000/v1}}
      OPENAI_MODEL: ${MEM0_LLM_MODEL:-${INFERENCE_MODEL:-bonsai-27b}}
      MEM0_EMBEDDER_PROVIDER: ${MEM0_EMBEDDER_PROVIDER:-openai}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL:-text-embedding-3-small}
      MEM0_EMBEDDER_HOST: ${MEM0_EMBEDDER_HOST:-https://api.openai.com/v1}
      MEM0_EMBEDDER_API_KEY: ${MEM0_EMBEDDER_API_KEY:-}
      ADMIN_API_KEY: ${MEM0_ADMIN_API_KEY:-mem0_lab_admin_key_change_me}
      JWT_SECRET: ${MEM0_JWT_SECRET:-mem0_lab_jwt_secret_change_me}
    depends_on:
      - chromadb

  # ============= OPTIONAL PROTOCOLS =============
  a2a-agent:
    profiles: ["protocols", "full"]
    build: ./a2a-agent
    container_name: lab-a2a-agent
    ports:
      - "127.0.0.1:4000:4000"

  mcp-memory:
    profiles: ["protocols", "full"]
    image: mcp/memory:latest
    container_name: lab-mcp-memory
    command: ["npx", "-y", "@modelcontextprotocol/server-memory"]
    ports:
      - "127.0.0.1:3004:3000"

  mcp-filesystem:
    profiles: ["protocols", "full"]
    image: mcp/filesystem:latest
    container_name: lab-mcp-filesystem
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/data"]
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./sensitive-data:/data:ro

  mcp-fetch:
    profiles: ["protocols", "full"]
    image: mcp/fetch:latest
    container_name: lab-mcp-fetch
    command: ["npx", "-y", "@modelcontextprotocol/server-fetch"]
    ports:
      - "127.0.0.1:3003:3000"

  # ============= FULL PROFILE: SIEM =============
  elasticsearch:
    profiles: ["full"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: lab-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1G

  kibana:
    profiles: ["full"]
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: lab-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch

  filebeat:
    profiles: ["full"]
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: lab-filebeat
    user: root
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs:ro
    depends_on:
      - elasticsearch

volumes:
  kong_data:
  chroma_data:
  milvus_data:
  lightrag_data:
  mem0_data:
  es_data:
  training_data:

# Mem0 OSS configuration used by local integration helpers.
# Upstream: https://github.com/mem0ai/mem0
# The API server itself is authenticated; see ADMIN_API_KEY/JWT_SECRET in Compose.

llm:
  provider: ollama
  config:
    model: llama3.2:1b
    ollama_base_url: http://ollama-llama:11434
    temperature: 0.2

embedder:
  provider: ollama
  config:
    model: nomic-embed-text
    ollama_base_url: http://ollama-llama:11434

# The OSS SDK uses vector_store rather than a generic storage.mode key.
# ChromaDB keeps this lab self-contained; the history path is file-backed.
vector_store:
  provider: chroma
  config:
    collection_name: novatech_memories
    host: chromadb
    port: 8000

history_db_path: /data/mem0/history.db

memory_levels:
  user_id:
    description: Long-lived preferences and facts scoped to one user.
  run_id:
    description: Short-lived conversation state for one execution/session.
  agent_id:
    description: Agent-owned facts and observations scoped to one agent.

api:
  base_url: http://127.0.0.1:8888
  memory_endpoint: /memories
  search_endpoint: /search
  auth_header: X-API-Key

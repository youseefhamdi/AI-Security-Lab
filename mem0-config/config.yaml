# Mem0 configuration for the AI Red Team Lab.
# The model and embedding model must already be available locally.

llm:
  provider: ollama
  config:
    model: llama3.2:1b
    ollama_base_url: http://ollama-llama:11434
    temperature: 0.2

embedder:
  provider: ollama
  config:
    model: nomic-embed-text
    ollama_base_url: http://ollama-llama:11434

# Simple local mode for exercises. Mem0-compatible deployments may map this
# to their file-backed history/vector implementation.
storage:
  mode: file
  path: /data/mem0

# Production alternative; inactive while storage.mode is file.
production_storage:
  mode: postgres
  host: postgres
  port: 5432
  database: mem0
  user: mem0
  password_env: MEM0_POSTGRES_PASSWORD

memory_levels:
  user_id:
    description: Long-lived preferences and facts scoped to one user.
  session_id:
    description: Short-lived state scoped to one conversation session.
  agent_id:
    description: Agent-owned facts and observations scoped to one agent.

api:
  base_url: http://127.0.0.1:8081
  memory_endpoint: /memories
